spring.application.name=japan-kanji

# Profile mac dinh khi chay local la "dev".
# Khi deploy, dat bien moi truong SPRING_PROFILES_ACTIVE=prod de nap them application-prod.properties
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===== Database =====
# Doc tu bien moi truong; neu khong co thi dung Postgres local (docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/japankanji}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# update: chi them bang/cot moi, KHONG xoa du lieu cu moi lan khoi dong lai
# (truoc day la "create" -> moi lan restart la mat sach du lieu nguoi dung)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
# Gia tri mac dinh CHI dung cho local. Production bat buoc dat JWT_SECRET (xem application-prod.properties)
jwt.secret=${JWT_SECRET:aVeryLongRandomSecretKeyThatShouldBeAtLeast256BitsForHmacSha256Algorithm}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== Du lieu khoi tao (DataSeeder) =====
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@japankanji.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
# Tao tai khoan demo user1/user2 (chi nen bat o local)
app.seed.demo-users=true

# ===== CORS =====
# Cho phep nhieu domain ngan cach bang dau phay (vd: http://localhost:5173,https://your-domain.com)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
