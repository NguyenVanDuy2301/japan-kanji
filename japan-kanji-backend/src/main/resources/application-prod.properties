# Cau hinh PRODUCTION - chi nap khi SPRING_PROFILES_ACTIVE=prod
# Cac gia tri ben duoi KHONG co mac dinh: thieu bien moi truong thi app bao loi ngay khi khoi dong
# (fail-fast), tranh viec vo tinh chay production bang mat khau/secret mau cong khai tren GitHub.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Tat log SQL de do ton tai nguyen va khong lo du lieu ra log
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

jwt.secret=${JWT_SECRET}

app.admin.password=${ADMIN_PASSWORD}
app.seed.demo-users=false

