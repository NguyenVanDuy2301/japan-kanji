services:
  postgres:
    image: postgres:16-alpine
    container_name: japankanji-postgres
    environment:
      POSTGRES_DB: japankanji
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - japankanji-pgdata:/var/lib/postgresql/data

volumes:
  japankanji-pgdata: