services:
  postgres:
    image: postgres:16-alpine
    container_name: japankanji-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-japankanji}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Vui long dat DB_PASSWORD trong file .env}
    volumes:
      - japankanji-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-japankanji}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./japan-kanji-backend
      dockerfile: Dockerfile
    container_name: japankanji-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-japankanji}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Vui long dat JWT_SECRET (>= 32 ky tu) trong file .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@japankanji.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Vui long dat ADMIN_PASSWORD trong file .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}

  frontend:
    build:
      context: ./japan-kanji-frontend
      dockerfile: Dockerfile
    container_name: japankanji-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  japankanji-pgdata:

